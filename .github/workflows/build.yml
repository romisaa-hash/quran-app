name: بناء التطبيق

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate platform folders
        run: |
          flutter create --org com.rafiqalmuslim --project-name quran_app --platforms android,ios .
          rm -rf test
          python3 scripts/patch_platforms.py .

      - name: Get packages
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons
        continue-on-error: true

      - name: Analyze (info only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk rafiq-almuslim.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rafiq-almuslim-apk
          path: rafiq-almuslim.apk

      - name: Publish download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: رفيق المسلم - نسخة ${{ github.run_number }}
          body: |
            📱 لتنزيل التطبيق على أندرويد: اضغط على ملف rafiq-almuslim.apk بالأسفل من الموبايل، وبعد التحميل افتحه واضغط "تثبيت".
            لو ظهرت رسالة "مصدر غير معروف" اسمح بالتثبيت من الإعدادات.
          files: rafiq-almuslim.apk
          make_latest: true

  ios:
    name: iOS build check (unsigned)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: |
          flutter create --org com.rafiqalmuslim --project-name quran_app --platforms android,ios .
          rm -rf test
          python3 scripts/patch_platforms.py .

      - name: Get packages
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons
        continue-on-error: true

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr rafiq-almuslim-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: rafiq-almuslim-ios-unsigned
          path: rafiq-almuslim-unsigned.ipa
