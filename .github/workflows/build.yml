name: بناء التطبيق

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate platform folders
        run: |
          flutter create --org com.rafiqalmuslim --project-name quran_app --platforms android,ios .
          rm -rf test
          python3 scripts/patch_platforms.py .

      - name: Get packages
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons
        continue-on-error: true

      - name: Analyze (info only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
        continue-on-error: true

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Save logs to ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/logs && cp *.log /tmp/logs/ 2>/dev/null || true
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-logs || true
          git checkout --orphan ci-logs-new
          git rm -rf --cached . >/dev/null
          rm -rf android ios
          mkdir -p android-logs && cp /tmp/logs/*.log android-logs/ 2>/dev/null || true
          git add android-logs && git commit -m "android logs ${{ github.run_number }}" || true
          git push -f origin ci-logs-new:ci-logs-android || true

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk rafiq-almuslim.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rafiq-almuslim-apk
          path: rafiq-almuslim.apk

      - name: Publish download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: رفيق المسلم - نسخة ${{ github.run_number }}
          body: |
            📱 لتنزيل التطبيق على أندرويد: اضغط على ملف rafiq-almuslim.apk بالأسفل من الموبايل، وبعد التحميل افتحه واضغط "تثبيت".
            لو ظهرت رسالة "مصدر غير معروف" اسمح بالتثبيت من الإعدادات.
          files: rafiq-almuslim.apk
          make_latest: true

  ios:
    name: iOS build check (unsigned)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: |
          flutter create --org com.rafiqalmuslim --project-name quran_app --platforms android,ios .
          rm -rf test
          python3 scripts/patch_platforms.py .

      - name: Get packages
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons
        continue-on-error: true

      - name: Build iOS (no codesign)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee build.log

      - name: Save logs
        if: always()
        run: |
          mkdir -p /tmp/logs && cp *.log /tmp/logs/ 2>/dev/null || true
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs-new
          git rm -rf --cached . >/dev/null
          mkdir -p ios-logs && cp /tmp/logs/*.log ios-logs/ 2>/dev/null || true
          git add ios-logs && git commit -m "ios logs ${{ github.run_number }}" || true
          git push -f origin ci-logs-new:ci-logs-ios || true

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr rafiq-almuslim-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: rafiq-almuslim-ios-unsigned
          path: rafiq-almuslim-unsigned.ipa
