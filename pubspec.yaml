name: quran_app
description: "رفيق المسلم - المصحف ومواقيت الصلاة والأذكار"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.0.0
  timezone: any
  geolocator: any
  geocoding: any
  just_audio: any
  cached_network_image: any
  flutter_cache_manager: any
  shared_preferences: any
  http: any
  flutter_compass: any
  google_fonts: any
  hijri: any

dev_dependencies:
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0F4C3A"
  adaptive_icon_foreground: "assets/icon_fg.png"
